name: Build StandUp APK

# 触发条件：每次推送代码到 main 分支，或者在网页上手动点击按钮触发
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 使用 GitHub 免费的 Linux 服务器（已内置 Android SDK）

    steps:
      # 1. 拉取你的仓库代码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 配置 Java 17 环境 (编译现代 Android 必备)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 自动安装指定版本的 Gradle (免去你在本地生成 gradlew 包装器的麻烦)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      # 4. 执行打包命令 (生成自带测试签名的 Debug 安装包，可直接安装到手机)
      - name: Build Debug APK
        run: gradle assembleDebug

      # 5. 将生成的 APK 上传到 GitHub Actions 页面供你下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StandUp-APK
          path: app/build/outputs/apk/debug/app-debug.apk
